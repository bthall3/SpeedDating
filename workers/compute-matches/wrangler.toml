name = "compute-matches"
main = "index.js"
compatibility_date = "2026-09-01"

# keep_vars stops a `wrangler deploy` from wiping any vars set in the dashboard.
keep_vars = true

# Secrets (set in the dashboard or with `npx wrangler secret put <NAME>`):
#   REDCAP_API_TOKEN  -- REDCap token with import + export rights
#   ADMIN_SECRET      -- password typed on match-admin.html
