<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compute Matches — Admin</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  :root {
    --crimson: #9E1B32;
    --crimson-soft: #c95a6c;
    --gold: #b8924a;
    --ink: #24211f;
    --paper: #faf7f2;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    padding: 2rem 1rem;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #fff;
    border: 1px solid #e6ddd2;
    border-radius: 12px;
    padding: 2rem;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 1.4rem;
    color: var(--crimson);
    margin: 0 0 0.25rem;
  }
  p.sub {
    margin: 0 0 1.5rem;
    color: #6b6259;
    font-size: 0.9rem;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.3rem;
  }
  input {
    width: 100%;
    padding: 0.6rem 0.7rem;
    border: 1px solid #d9cfc2;
    border-radius: 8px;
    font-size: 1rem;
    margin-bottom: 1.1rem;
  }
  button {
    width: 100%;
    padding: 0.7rem;
    background: var(--crimson);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--crimson-soft); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #result {
    margin-top: 1.2rem;
    font-size: 0.85rem;
    white-space: pre-wrap;
    background: #f5f0e8;
    border-radius: 8px;
    padding: 0.8rem;
    display: none;
  }
  #result.show { display: block; }
  #result.error { color: var(--crimson); }
</style>
</head>
<body>
  <div class="card">
    <h1>Compute & Send Matches</h1>
    <p class="sub">Runs after all scorecards for an event are entered. Safe to re-run — already-notified pairs are skipped.</p>

    <label for="event">Event number</label>
    <input type="text" id="event" placeholder="e.g. 3" />

    <label for="secret">Admin password</label>
    <input type="password" id="secret" />

    <button id="runBtn">Compute & Send Matches</button>
    <button id="csvBtn" style="margin-top:0.6rem; background:#fff; color:var(--crimson); border:1px solid var(--crimson);">Download CSV Summary</button>

    <div id="result"></div>
  </div>

  <script>
    // Set this to your deployed Worker URL after creating it in Cloudflare.
    const WORKER_URL = "https://compute-matches.bthall3.workers.dev";

    const btn = document.getElementById("runBtn");
    const resultEl = document.getElementById("result");

    btn.addEventListener("click", async () => {
      const event = document.getElementById("event").value.trim();
      const adminSecret = document.getElementById("secret").value;

      if (!event || !adminSecret) {
        showResult("Enter both an event number and the admin password.", true);
        return;
      }

      btn.disabled = true;
      btn.textContent = "Working...";
      showResult("", false, false);

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ event, adminSecret }),
        });
        const data = await res.json();

        if (!res.ok) {
          showResult("Error: " + (data.error || res.status), true);
        } else {
          const previewText = (data.preview || [])
            .map((p) => `  ${p.record_id}: ${p.match_count} match(es)${p.matched_with.length ? " — " + p.matched_with.join(", ") : ""}`)
            .join("\n");

          showResult(
            `Event ${data.event}\n` +
            `Attendees found: ${data.attendeesFound}\n` +
            `Mutual matches found: ${data.mutualMatchesFound}\n` +
            `People emailed: ${data.peopleProcessed}\n` +
            (data.alreadyProcessedSkipped ? `Already processed (skipped): ${data.alreadyProcessedSkipped}\n` : "") +
            (data.diagnostics ? `\nAttendees (event_num match): ${data.diagnostics.attendeesFromEventNum}\nFull rows returned: ${data.diagnostics.fullRowsReturned}\nScorecard rows found: ${data.diagnostics.scorecardRowsFound}\n` + (data.diagnostics.unresolvedPartnerPids.length ? `Unresolved partner PIDs (typos?): ${data.diagnostics.unresolvedPartnerPids.join(", ")}\n` : "") : "") +
            (previewText ? `\nPer-person preview:\n${previewText}` : ""),
            false
          );
        }
      } catch (err) {
        showResult("Network error: " + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Compute & Send Matches";
      }
    });

    document.getElementById("csvBtn").addEventListener("click", async () => {
      const event = document.getElementById("event").value.trim();
      const adminSecret = document.getElementById("secret").value;

      if (!event || !adminSecret) {
        showResult("Enter both an event number and the admin password.", true);
        return;
      }

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ event, adminSecret, format: "csv" }),
        });

        if (!res.ok) {
          const data = await res.json();
          showResult("Error: " + (data.error || res.status), true);
          return;
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `matches-event-${event}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        showResult("CSV downloaded. Move it to Box/OneDrive per IRB storage requirements — don't leave it sitting in Downloads.", false);
      } catch (err) {
        showResult("Network error: " + err.message, true);
      }
    });

    function showResult(text, isError, show = true) {
      resultEl.textContent = text;
      resultEl.className = show ? (isError ? "show error" : "show") : "";
    }
  </script>
</body>
</html>
