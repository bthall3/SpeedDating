<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 7 — Planning</title>
<link rel="stylesheet" href="../styles.css">
<style>
.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 40px 24px 100px;
}

.progress-track {
  height: 4px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 40px;
}
.progress-fill {
  height: 100%;
  background: var(--crimson);
  border-radius: 2px;
  transition: width 0.4s ease;
}

.eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--crimson);
  margin-bottom: 14px;
}
h1 {
  font-size: 28px;
  line-height: 1.2;
}

.btn { margin-top: 24px; }
.btn.secondary {
  background: var(--bg-card);
  color: var(--crimson);
  border: 1.5px solid var(--crimson);
}
.btn.secondary:hover:not(:disabled) { background: var(--terracotta); }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; }

/* Planning table blocks */
.plan-block {
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 14px;
}
.plan-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--crimson);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 8px;
}
.plan-textarea {
  width: 100%;
  min-height: 100px;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 9px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--ink);
  background: var(--bg);
  resize: vertical;
  line-height: 1.6;
}
.plan-textarea:focus { outline: none; border-color: var(--crimson); }
.plan-hint {
  font-size: 12px;
  color: var(--ink-soft);
  margin-top: 6px;
}

.save-status {
  font-size: 12.5px;
  color: var(--ink-soft);
  margin-top: 8px;
  min-height: 16px;
}
.save-status.success { color: var(--crimson); }
.save-status.error { color: var(--crimson); font-weight: 600; }

.continue-block {
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}
</style>
</head>
<body>

<div class="wrap">
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:100%"></div></div>
  <div id="app"></div>
</div>

<script>
/* =========================================================================
   CONFIG
   ========================================================================= */
const CONFIG = {
  saveEndpoint: "https://module7-planning.bthall3.workers.dev", // TODO: confirm once deployed
  practiceChatUrl: "practice-chat.html" // still the old pid-based version until rebuilt
};

function getToken() {
  return new URLSearchParams(window.location.search).get("token");
}
const TOKEN = getToken();

function render() {
  document.getElementById("app").innerHTML = `
    <div class="eyebrow">Module 7 · Part 7 of 7</div>
    <h1>Planning</h1>
    <p>In most areas of life, success is often mostly attributable to proper planning. The information presented in these modules is valuable but becomes much more valuable if you plan on how to implement it.</p>
    <p>Use the boxes below to write out some conversation starters, topics, and follow-up questions. After you've written some ideas down, you can click "Email me" to have these ideas sent to your email so you can reference them. You can also return to this page later to add more ideas.</p>

    <div class="plan-block">
      <div class="plan-label">Conversation starters</div>
      <textarea class="plan-textarea" id="planStarters" placeholder="Write a few ideas for how you might start a conversation..."></textarea>
    </div>

    <div class="plan-block">
      <div class="plan-label">Conversation topics</div>
      <textarea class="plan-textarea" id="planTopics" placeholder="Write a few topics you might want to bring up..."></textarea>
    </div>

    <div class="plan-block">
      <div class="plan-label">Follow-up questions</div>
      <textarea class="plan-textarea" id="planFollowups" placeholder="Write a few follow-up questions to keep conversation going..."></textarea>
    </div>

    <div class="btn-row">
      <button class="btn secondary" id="emailMeBtn" onclick="emailMe()">Email me these ideas</button>
    </div>
    <div class="save-status" id="saveStatus"></div>

    <div class="continue-block">
      <p>Finally, you'll be given an opportunity to go on a "practice date" with an automated chatbot designed for this study, which will simulate various types of dates you might encounter to give you practice with thinking on your feet.</p>
      <a class="btn" href="${CONFIG.practiceChatUrl}?token=${encodeURIComponent(TOKEN || "")}">Continue to practice date</a>
    </div>
  `;
}

async function emailMe() {
  const btn = document.getElementById("emailMeBtn");
  const statusEl = document.getElementById("saveStatus");
  statusEl.className = "save-status";
  statusEl.textContent = "";
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Sending...';

  const payload = {
    token: TOKEN,
    m7_starters: document.getElementById("planStarters").value.trim(),
    m7_topics: document.getElementById("planTopics").value.trim(),
    m7_followups: document.getElementById("planFollowups").value.trim()
  };

  try {
    const res = await fetch(CONFIG.saveEndpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("save failed");
    statusEl.textContent = "Sent! Check your email in a few minutes.";
    statusEl.classList.add("success");
  } catch (err) {
    console.error("module7 email-me failed:", err);
    statusEl.textContent = "Something went wrong. Please try again.";
    statusEl.classList.add("error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Email me these ideas";
  }
}

if (!TOKEN) {
  document.getElementById("app").innerHTML = `
    <div class="eyebrow">Before the Event</div>
    <h1>This link looks incomplete.</h1>
    <p>Please use the link from your training email to access this module.</p>
  `;
} else {
  render();
}
</script>

</body>
</html>
