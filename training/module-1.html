<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 1 — Getting Ready</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap');

:root {
  --bg: #f7f2ea;
  --bg-card: #fffdf9;
  --ink: #2b241f;
  --ink-soft: #6b5f54;
  --crimson: #9E1B32;
  --crimson-soft: #c95a6c;
  --terracotta: #ecddd6;
  --line: #e3d6ca;
  --gold: #b8924a;
  --radius: 14px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}

.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 40px 24px 100px;
}

.progress-track {
  height: 4px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 40px;
}
.progress-fill {
  height: 100%;
  background: var(--crimson);
  border-radius: 2px;
  transition: width 0.4s ease;
}

.eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--crimson);
  margin-bottom: 14px;
}
h1 {
  font-family: 'Lora', serif;
  font-weight: 500;
  font-size: 30px;
  line-height: 1.2;
  margin: 0 0 20px;
  letter-spacing: -0.01em;
}
p {
  font-size: 15.5px;
  line-height: 1.7;
  color: var(--ink-soft);
  margin: 0 0 16px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 28px;
  border: none;
  border-radius: 10px;
  background: var(--crimson);
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.1s ease;
  margin-top: 24px;
}
.btn:hover:not(:disabled) { background: #7f1728; }
.btn:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }

/* Reframe cards */
.reframe-list { margin: 28px 0; }
.reframe-card {
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.reframe-card:hover { border-color: var(--crimson-soft); }
.reframe-card.flipped { border-color: var(--crimson); box-shadow: 0 4px 16px rgba(158,27,50,0.08); }

.reframe-original {
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
}
.reframe-hint {
  font-size: 12px;
  color: var(--ink-soft);
  margin-top: 4px;
}
.reframe-reveal {
  display: none;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  font-family: 'Lora', serif;
  font-style: italic;
  font-size: 15px;
  color: var(--crimson);
}
.reframe-card.flipped .reframe-reveal { display: block; }
.reframe-card.flipped .reframe-hint { display: none; }

/* Check section */
.check-block {
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
}
.check-label {
  font-size: 13.5px;
  font-weight: 600;
  margin-bottom: 14px;
}

.checkbox-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 0;
  cursor: pointer;
}
.checkbox-row input {
  margin-top: 3px;
  width: 18px;
  height: 18px;
  accent-color: var(--crimson);
  cursor: pointer;
  flex-shrink: 0;
}
.checkbox-row label {
  font-size: 14.5px;
  line-height: 1.5;
  cursor: pointer;
}

textarea {
  width: 100%;
  min-height: 110px;
  padding: 14px 16px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14.5px;
  color: var(--ink);
  background: var(--bg);
  resize: vertical;
  margin-top: 6px;
}
textarea:focus { outline: none; border-color: var(--crimson); }

.error-text {
  color: var(--crimson);
  font-size: 13px;
  margin-top: 10px;
  display: none;
}

.hidden { display: none; }

/* Completion screen */
.complete-screen { text-align: center; padding: 40px 0; }
.complete-mark {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--crimson);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  margin: 0 auto 24px;
}
.back-link {
  display: inline-block;
  margin-top: 20px;
  font-size: 14px;
  color: var(--crimson);
  text-decoration: none;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }

.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="wrap">
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:25%"></div></div>
  <div id="app"></div>
</div>

<script>
/* =========================================================================
   CONFIG
   ========================================================================= */
const CONFIG = {
  submitEndpoint: "https://module1-submit.bthall3.workers.dev", // TODO: confirm once deployed
  returnUrl: "./"  // back to training/ hub (same folder as this page)
};

function getToken() {
  return new URLSearchParams(window.location.search).get("token");
}
const TOKEN = getToken();

const REFRAMES = [
  { original: "I'm nervous about having to meet so many people.", reveal: "I'm excited that I get to meet new people." },
  { original: "I'm worried someone won't like me.", reveal: "I'm just going to be myself, and it's OK if I don't click with everyone." },
  { original: "My heart is racing and my palms are sweaty.", reveal: "My body is just getting prepared for this exciting opportunity." }
];

let step = 1;
const TOTAL_STEPS = 4;

function setProgress() {
  document.getElementById("progressFill").style.width = `${(step / TOTAL_STEPS) * 100}%`;
}

function goToStep(n) {
  step = n;
  setProgress();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render() {
  const app = document.getElementById("app");
  if (step === 1) app.innerHTML = renderStep1();
  if (step === 2) app.innerHTML = renderStep2();
  if (step === 3) app.innerHTML = renderStep3();
  if (step === 4) app.innerHTML = renderStep4();

  if (step === 2) attachReframeHandlers();
  if (step === 3) attachCheckHandlers();
}

function renderStep1() {
  return `
    <div class="eyebrow">Module 1 · Part 1 of 7</div>
    <h1>Getting ready for your dates</h1>
    <p>Our appearance is the first thing people notice about us and has a large effect on dating success. Evidence suggests that making an effort to look our best can increase chances of success in dating situations. This can be achieved via wearing something that makes you feel confident and comfortable, as well as considering outfits that are flattering to features that you consider to be your "best."</p>
    <p>Research also suggests that humans are sensitive to smell in dating situations. So, showering prior to the event and potentially wearing cologne or perfume may aid in dating success.</p>
    <button class="btn" onclick="goToStep(2)">Continue</button>
  `;
}

function renderStep2() {
  const cards = REFRAMES.map((r, i) => `
    <div class="reframe-card" data-index="${i}">
      <div class="reframe-original">${r.original}</div>
      <div class="reframe-hint">Tap to reveal a reframe</div>
      <div class="reframe-reveal">${r.reveal}</div>
    </div>
  `).join("");

  return `
    <div class="eyebrow">Module 1 · Part 1 of 7</div>
    <h1>Help! I'm nervous!</h1>
    <p>It is completely normal, and expected, to be a bit nervous before the speed dating event. But thinking that you are nervous or anxious can make it difficult to relax and enjoy your conversations.</p>
    <p>While we understand it is easier said than done, one approach is to think of any nervousness as excitement. Research has shown that reframing anxiety as excitement can make people more relaxed and confident.</p>
    <p><strong>Tap each statement below to see how you might reframe it.</strong></p>
    <div class="reframe-list">${cards}</div>
    <button class="btn" onclick="goToStep(3)">Continue</button>
  `;
}

function attachReframeHandlers() {
  document.querySelectorAll(".reframe-card").forEach(card => {
    card.addEventListener("click", () => card.classList.toggle("flipped"));
  });
}

function renderStep3() {
  return `
    <div class="eyebrow">Module 1 · Check-in</div>
    <h1>Understanding and application check</h1>

    <div class="check-block">
      <div class="check-label">Which of the following can help enhance your appearance? Select all that apply.</div>
      <div class="checkbox-row" onclick="document.getElementById('cb1').click()">
        <input type="checkbox" id="cb1">
        <label for="cb1" onclick="event.stopPropagation()">Looking clean and put-together</label>
      </div>
      <div class="checkbox-row" onclick="document.getElementById('cb2').click()">
        <input type="checkbox" id="cb2">
        <label for="cb2" onclick="event.stopPropagation()">Wearing outfits that highlight your best features</label>
      </div>
      <div class="checkbox-row" onclick="document.getElementById('cb3').click()">
        <input type="checkbox" id="cb3">
        <label for="cb3" onclick="event.stopPropagation()">Wearing cologne or perfume</label>
      </div>
    </div>

    <div class="check-block">
      <div class="check-label">What are you most nervous about for the event? How can you reframe that to turn it into something more positive?</div>
      <textarea id="reflection" placeholder="Type your answer here..."></textarea>
    </div>

    <div class="error-text" id="errorText">Please check all three boxes and share a reflection before continuing.</div>
    <button class="btn" id="submitBtn" disabled onclick="submitModule()">Complete Module</button>
  `;
}

function attachCheckHandlers() {
  const inputs = ["cb1", "cb2", "cb3", "reflection"].map(id => document.getElementById(id));
  const submitBtn = document.getElementById("submitBtn");

  function checkValid() {
    const allChecked = document.getElementById("cb1").checked
      && document.getElementById("cb2").checked
      && document.getElementById("cb3").checked;
    const hasReflection = document.getElementById("reflection").value.trim().length > 0;
    submitBtn.disabled = !(allChecked && hasReflection);
  }

  inputs.forEach(el => el.addEventListener(el.tagName === "TEXTAREA" ? "input" : "change", checkValid));
}

function renderStep4() {
  return `
    <div class="complete-screen">
      <div class="complete-mark">&#10003;</div>
      <h1>Module 1 complete</h1>
      <p>Nice work. You can head back to your training dashboard to continue with the next module.</p>
      <a class="back-link" href="${CONFIG.returnUrl}?token=${encodeURIComponent(TOKEN || "")}">&larr; Back to your training</a>
    </div>
  `;
}

async function submitModule() {
  const btn = document.getElementById("submitBtn");
  const errorText = document.getElementById("errorText");
  errorText.style.display = "none";
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Saving...';

  const payload = {
    token: TOKEN,
    m1_clean: document.getElementById("cb1").checked ? 1 : 0,
    m1_outfit: document.getElementById("cb2").checked ? 1 : 0,
    m1_scent: document.getElementById("cb3").checked ? 1 : 0,
    m1_reframe: document.getElementById("reflection").value.trim(),
    m1_started_ts: formatRedcapDatetime(START_TS)
  };

  try {
    const res = await fetch(CONFIG.submitEndpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("submit failed");
    goToStep(4);
  } catch (err) {
    console.error("module1 submit failed:", err);
    errorText.textContent = "Something went wrong saving your responses. Please try again.";
    errorText.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Complete Module";
  }
}
const START_TS = new Date();
function formatRedcapDatetime(d) {
  const pad = n => String(n).padStart(2, "0");
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
}
  
if (!TOKEN) {
  document.getElementById("app").innerHTML = `
    <div class="eyebrow">Before the Event</div>
    <h1>This link looks incomplete.</h1>
    <p>Please use the link from your training email to access this module.</p>
  `;
} else {
  render();
}
</script>

</body>
</html>
