<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 2 — Introducing Yourself</title>
<link rel="stylesheet" href="../styles.css">
<style>
.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 40px 24px 100px;
}

.progress-track {
  height: 4px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 40px;
}
.progress-fill {
  height: 100%;
  background: var(--crimson);
  border-radius: 2px;
  transition: width 0.4s ease;
}

.eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--crimson);
  margin-bottom: 14px;
}
h1 {
  font-size: 30px;
  line-height: 1.2;
}

.btn {
  margin-top: 24px;
}

/* Video blocks */
.video-block {
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
}
.video-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--crimson);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 12px;
}
video {
  width: 100%;
  border-radius: 10px;
  background: #000;
  display: block;
  margin-bottom: 14px;
}
.video-script {
  font-size: 14px;
  line-height: 1.7;
  color: var(--ink-soft);
  background: var(--bg);
  border-radius: 8px;
  padding: 14px 16px;
}
.video-script strong { color: var(--ink); }
.watched-flag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--crimson-soft);
  margin-top: 10px;
}
.watched-flag.done { color: var(--crimson); }

.tip-block {
  background: var(--terracotta);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-top: 8px;
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--ink);
}
.tip-label {
  font-weight: 700;
  color: var(--crimson);
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
  display: block;
}

.gate-note {
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 18px;
}

/* Completion screen */
.complete-screen { text-align: center; padding: 40px 0; }
.complete-mark {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: var(--crimson);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  margin: 0 auto 24px;
}
.back-link {
  display: inline-block;
  margin-top: 20px;
  font-size: 14px;
  color: var(--crimson);
  text-decoration: none;
  font-weight: 600;
}
.back-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="wrap">
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:33%"></div></div>
  <div id="app"></div>
</div>

<script>
/* =========================================================================
   CONFIG
   ========================================================================= */
const CONFIG = {
  submitEndpoint: "https://module2-submit.bthall3.workers.dev", // TODO: confirm once deployed
  returnUrl: "./"  // back to training/ hub (same folder as this page)
};

function getToken() {
  return new URLSearchParams(window.location.search).get("token");
}
const TOKEN = getToken();

const START_TS = new Date();
function formatRedcapDatetime(d) {
  const pad = n => String(n).padStart(2, "0");
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
}

let step = 1;
const TOTAL_STEPS = 3;
const watched = { v1: false, v2: false };

function setProgress() {
  document.getElementById("progressFill").style.width = `${(step / TOTAL_STEPS) * 100}%`;
}

function goToStep(n) {
  step = n;
  setProgress();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function render() {
  const app = document.getElementById("app");
  if (step === 1) app.innerHTML = renderStep1();
  if (step === 2) app.innerHTML = renderStep2();
  if (step === 3) app.innerHTML = renderStep3();

  if (step === 2) attachVideoHandlers();
}

function renderStep1() {
  return `
    <div class="eyebrow">Module 2 · Part 2 of 7</div>
    <h1>Making a good first impression</h1>
    <p>Because speed-dating dates are "blind" dates, you will have to introduce yourself to each of your dates. This provides an opportunity to make a good first impression. Research has shown that we form first impressions very quickly, and those impressions are often hard to change. So, starting your date strong can increase your chances of making a positive first impression.</p>
    <p>The following section covers the time from first meeting your date to beginning conversation.</p>
    <button class="btn" onclick="goToStep(2)">Continue</button>
  `;
}

function renderStep2() {
  return `
    <div class="eyebrow">Module 2 · Part 2 of 7</div>
    <h1>Introducing yourself</h1>
    <p>As you rotate around the room (or your dates rotate around to you), you can start each date off on the right foot by introducing yourself well. Watch both videos below for examples on how to introduce yourself or respond to your date's introduction.</p>

    <div class="video-block">
      <div class="video-label">If they introduce themselves first</div>
      <!-- TODO: replace intro-video-1.mp4 with the real recorded video,
           placed in the same training/ folder as this page. Keep under
           GitHub's 100MB per-file cap; compress with HandBrake if needed. -->
      <video id="video1" controls playsinline>
        <source src="intro-video-1.mp4" type="video/mp4">
        Your browser doesn't support embedded video.
      </video>
      <div class="video-script">
        <strong>Them:</strong> "Hi, I'm [your name], it's nice to meet you!"<br>
        <strong>You:</strong> "Hi [their name], I'm [your name], nice to meet you too!"
      </div>
      <div class="watched-flag" id="watchedFlag1">○ Watch to continue</div>
    </div>

    <div class="video-block">
      <div class="video-label">If you introduce yourself first</div>
      <!-- TODO: replace intro-video-2.mp4 with the real recorded video. -->
      <video id="video2" controls playsinline>
        <source src="intro-video-2.mp4" type="video/mp4">
        Your browser doesn't support embedded video.
      </video>
      <div class="video-script">
        <strong>You:</strong> "Hi, I'm [your name], it's nice to meet you!"<br>
        <strong>Them:</strong> "Hi, I'm [their name], nice to meet you too!"
      </div>
      <div class="watched-flag" id="watchedFlag2">○ Watch to continue</div>
    </div>

    <div class="tip-block">
      <span class="tip-label">Tip</span>
      Did you notice how the person introducing themselves in the video said their date's name during introductions? Research has demonstrated that people like being called their name because it demonstrates that people are listening to and interested in them.
    </div>

    <div class="gate-note" id="gateNote">Watch both videos above to continue.</div>
    <div class="error-text" id="errorText">Something went wrong saving your progress. Please try again.</div>
    <button class="btn" id="continueBtn" disabled onclick="submitModule()">Complete Module</button>
  `;
}

function attachVideoHandlers() {
  const v1 = document.getElementById("video1");
  const v2 = document.getElementById("video2");

  v1.addEventListener("ended", () => markWatched(1));
  v2.addEventListener("ended", () => markWatched(2));
}

function markWatched(n) {
  watched[`v${n}`] = true;
  document.getElementById(`watchedFlag${n}`).textContent = "✓ Watched";
  document.getElementById(`watchedFlag${n}`).classList.add("done");

  const bothWatched = watched.v1 && watched.v2;
  document.getElementById("continueBtn").disabled = !bothWatched;
  document.getElementById("gateNote").textContent = bothWatched
    ? "Both videos watched — you're ready to continue."
    : "Watch both videos above to continue.";
}

function renderStep3() {
  return `
    <div class="complete-screen">
      <div class="complete-mark">&#10003;</div>
      <h1>Module 2 complete</h1>
      <p>Nice work. You can head back to your training dashboard to continue with the next module.</p>
      <a class="back-link" href="${CONFIG.returnUrl}?token=${encodeURIComponent(TOKEN || "")}">&larr; Back to your training</a>
    </div>
  `;
}

async function submitModule() {
  const btn = document.getElementById("continueBtn");
  const errorText = document.getElementById("errorText");
  errorText.style.display = "none";
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Saving...';

  const payload = {
    token: TOKEN,
    m2_video1_watched: watched.v1 ? 1 : 0,
    m2_video2_watched: watched.v2 ? 1 : 0,
    m2_started_ts: formatRedcapDatetime(START_TS)
  };

  try {
    const res = await fetch(CONFIG.submitEndpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("submit failed");
    goToStep(3);
  } catch (err) {
    console.error("module2 submit failed:", err);
    errorText.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Complete Module";
  }
}

if (!TOKEN) {
  document.getElementById("app").innerHTML = `
    <div class="eyebrow">Before the Event</div>
    <h1>This link looks incomplete.</h1>
    <p>Please use the link from your training email to access this module.</p>
  `;
} else {
  render();
}
</script>

</body>
</html>
